<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>写真合成＆レイアウトエディタ</title>
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="icon" type="image/png" href="icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="写真エディタ">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">
    <header>
      <h1>写真合成＆レイアウトエディタ</h1>
    </header>

    <!-- 1. ベース・背景の準備 -->
    <section class="panel">
      <h2>1. ベース・背景の準備</h2>
      <div class="row">
        <span style="font-size: 0.85rem; font-weight: bold;">ベース写真:</span>
        <input type="file" id="bgImageInput" accept="image/*" class="direct-file-input">
      </div>
      <div class="row bg-maker">
        <select id="aspectSelect">
          <option value="1:1">1:1 (正方形)</option>
          <option value="4:3">4:3 (横長)</option>
          <option value="16:9">16:9 (ワイド)</option>
          <option value="9:16">9:16 (スマホ縦)</option>
        </select>
        <select id="bgTypeSelect">
          <option value="solid">単色背景</option>
          <option value="gradient">グラデーション</option>
          <option value="rainbow">🌈 虹色（レインボー）</option>
          <option value="dots">ドット柄</option>
          <option value="check">チェック柄</option>
        </select>
        <input type="color" id="bgColor1" value="#ffffff">
        <input type="color" id="bgColor2" value="#a2d2ff">
        <button type="button" id="createBgBtn" class="btn">背景を作成</button>
      </div>
    </section>

    <!-- 2. 写真・テキストの重ね合わせ -->
    <section class="panel">
      <h2>2. 写真・テキストを追加・編集（ドラッグ＆ドロップも可）</h2>
      <div class="row">
        <span style="font-size: 0.85rem; font-weight: bold;">重ねる写真:</span>
        <input type="file" id="addLayerInput" accept="image/*" class="direct-file-input">
        <button type="button" id="pasteImgBtn" class="btn small">📋 貼付</button>
      </div>

      <!-- テキスト追加エリア -->
      <div class="row text-maker">
        <input type="text" id="textInput" placeholder="文字を入力..." class="text-input">
        <input type="color" id="textColor" value="#111111" title="文字の色">
        <label style="font-size: 0.85rem; display: flex; align-items: center; gap: 4px; cursor: pointer;">
          <input type="checkbox" id="textRainbowCheck"> 🌈虹色
        </label>
        <button type="button" id="addTextBtn" class="btn">＋ テキスト追加</button>
      </div>

      <!-- レイヤー選択＆操作 -->
      <div id="layerControls" class="layer-controls hidden">
        <div class="row">
          <select id="layerSelect"></select>
          <button type="button" id="layerUpBtn" class="btn small">前面へ</button>
          <button type="button" id="layerDownBtn" class="btn small">背面へ</button>
          <button type="button" id="layerDeleteBtn" class="btn small danger">削除</button>
        </div>
        <div class="row">
          <button type="button" id="cropModeBtn" class="btn small accent">✂️ 好きな形に切る</button>
          <button type="button" id="resetCropBtn" class="btn small">切り抜きを戻す</button>
        </div>
        <div class="sliders">
          <label>大きさ: <input type="range" id="layerScale" min="0.05" max="3.0" step="0.02" value="0.5"></label>
          <label>回転: <input type="range" id="layerRotate" min="-180" max="180" step="1" value="0"></label>
        </div>
      </div>
    </section>

    <!-- 切り抜きモード中の案内パネル -->
    <div id="cropNoticePanel" class="panel notice-panel hidden">
      <p style="font-size: 0.85rem; font-weight: bold; color: #d97706;">
        ✂️ 切り抜き中：残したい部分を指でなぞって囲んでください（指を離すと切り抜かれます）
      </p>
      <button type="button" id="cancelCropBtn" class="btn small" style="margin-top: 6px;">キャンセル</button>
    </div>

    <!-- モード切り替え -->
    <div class="mode-tabs">
      <button type="button" id="tabEdit" class="tab active">✋ 写真配置</button>
      <button type="button" id="tabPan" class="tab">🖐 画面移動</button>
      <button type="button" id="tabPin" class="tab">🎯 範囲指定</button>
      <button type="button" id="tabPull" class="tab">🤏 引っ張る</button>
    </div>

    <!-- 拡大・表示リセット＆ガイド線表示切り替え -->
    <div class="panel zoom-panel">
      <div class="row" style="justify-content: space-between; margin-bottom: 4px;">
        <span style="font-size: 0.85rem;">🔍 2本指で拡大縮小 / 1本指で移動（現在: <strong id="zoomLabel">100%</strong>）</span>
        <button type="button" id="resetViewBtn" class="btn small">位置・拡大をリセット</button>
      </div>
      <div class="guide-toggle-inner">
        <label>
          <input type="checkbox" id="hideGuidesCheck"> ガイド線（青枠・赤丸・外枠）をすべて非表示にする
        </label>
      </div>
    </div>

    <!-- サブ機能用オプション -->
    <div id="pullOptions" class="panel sub-panel hidden">
      <div class="row" style="flex-direction: column; align-items: flex-start; gap: 6px; margin-bottom: 8px;">
        <label style="font-size: 0.85rem; font-weight: bold; display: flex; align-items: center; gap: 6px; cursor: pointer;">
          <input type="checkbox" id="freezePullCheck"> ❄️ 引っ張った形で止める（離しても戻らない）
        </label>
        <label style="font-size: 0.85rem; display: flex; align-items: center; gap: 6px; cursor: pointer;">
          <input type="checkbox" id="syncPinsCheck" checked> 🔗 すべての赤い円を同時に動かす（オフで1個ずつ別々に動く）
        </label>
      </div>

      <!-- 戻り方のプリセットボタン -->
      <div class="row" style="margin-bottom: 6px;">
        <span style="font-size: 0.85rem; font-weight: bold;">戻り方:</span>
        <button type="button" id="presetRubberBtn" class="btn small primary">⚡ 輪ゴム（パチン！）</button>
        <button type="button" id="presetSlimeBtn" class="btn small">🍮 スライム（ボヨン）</button>
      </div>

      <div class="sliders">
        <label>⭕ 円の塊感（丸ごと伸びる）: <input type="range" id="roundnessSlider" min="0.1" max="0.95" step="0.05" value="0.75"></label>
        <label>👆 引っ張る指の大きさ: <input type="range" id="fingerRadiusSlider" min="15" max="250" value="90"></label>
        <label>🎯 選択中の赤丸の広さ: <input type="range" id="pinRadiusSlider" min="15" max="250" value="75"></label>
        <label>⚡ 戻るスピード（独立）: <input type="range" id="springSlider" min="0.1" max="1.0" step="0.05" value="0.80"></label>
        <label>〰️ 揺れの回数（独立）: <input type="range" id="bounceSlider" min="0.0" max="0.90" step="0.05" value="0.25"></label>
      </div>
      <div class="row" style="margin-top: 8px;">
        <button type="button" id="resetDeformBtn" class="btn small">変形を元に戻す</button>
        <button type="button" id="deleteOnePinBtn" class="btn small">選択中の円を1つ削除</button>
        <button type="button" id="clearPinBtn" class="btn small danger">すべての円を解除</button>
      </div>
    </div>

    <!-- キャンバス表示エリア -->
    <div class="canvas-viewport" id="canvasViewport">
      <canvas id="canvas"></canvas>
    </div>

    <!-- 保存ボタン -->
    <div class="footer-actions">
      <button type="button" id="saveBtn" class="btn save">完成画像を保存する（今の形のまま保存）</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
