<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>写真合成＆引っ張りエディタ</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>写真合成＆引っ張りエディタ</h1>

    <!-- 画像読み込み -->
    <div class="controls">
      <label class="file-btn">
        1. 土台の写真を選ぶ
        <input type="file" id="bgInput" accept="image/*">
      </label>
      <label class="file-btn">
        2. 重ねる写真を選ぶ
        <input type="file" id="fgInput" accept="image/*">
      </label>
    </div>

    <!-- モード切り替え -->
    <div class="mode-switch">
      <button id="modePull" class="active">引っ張るモード</button>
      <button id="modeMove">重ね写真の位置移動</button>
    </div>

    <!-- パラメータ調整 -->
    <div class="sliders">
      <label>重ね写真のサイズ: <input type="range" id="scaleSlider" min="0.1" max="2.0" step="0.05" value="0.5"></label>
      <label>引っ張る範囲: <input type="range" id="radiusSlider" min="40" max="200" value="100"></label>
      <label>戻る弾力: <input type="range" id="springSlider" min="0.05" max="0.3" step="0.01" value="0.15"></label>
    </div>

    <!-- キャンバス -->
    <div class="canvas-wrapper">
      <canvas id="canvas" width="400" height="400"></canvas>
    </div>

    <div class="actions">
      <button id="saveBtn" class="save-btn">画像を保存する</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
